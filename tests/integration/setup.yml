# Provision the hermetic stack for e2e.yml: log in as the bootstrap admin,
# install the (sideloaded) s3 integration, declare the inventory, resource and
# the three connectors e2e.yml expects, initialize the kloset store, and mint
# an API key for a service account holding the owner role (the e2e both runs jobs
# and manages connector lifecycle).
#
# Run after `plakman bootstrap-root` has seeded the admin:
#
#   PLAKAR_API_URL=http://localhost:8080 ansible-playbook tests/integration/setup.yml
#
# The API key lands in tests/integration/stack/.apikey for e2e.yml to use.
#
# The service account is also named in each connector's srwx lists: grants
# alone leave job listings answering 200 with empty lists until
# PlakarKorp/plakman#1394 lands (listings filter on the caller's own tokens).
---
- name: Provision plakman for the e2e playbook
  hosts: localhost
  gather_facts: false
  vars:
    api_url: "{{ lookup('ansible.builtin.env', 'PLAKAR_API_URL') | default('http://localhost:8080', true) }}"
    admin_email: admin@example.com
    admin_password: "{{ lookup('ansible.builtin.env', 'PLAKAR_ADMIN_PASSWORD') | default('CIbootstrap-42!', true) }}"
    apikey_file: "{{ playbook_dir }}/stack/.apikey"
    s3_endpoint: minio
    s3_port: "9000"
    s3_access_key: minioadmin
    s3_secret_key: minioadmin
    s3_common_fields:
      passphrase: { value: correcthorsebatterystaple }
      access_key: { value: "{{ s3_access_key }}" }
      secret_access_key: { value: "{{ s3_secret_key }}" }
      port: { value: "{{ s3_port }}" }
      storage_class: { value: STANDARD }
      use_tls: { value: "false" }
      tls_insecure_no_verify: { value: "false" }
      virtual_host: { value: "false" }

  tasks:
    - name: Log in as the bootstrap admin
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/auth/login/password"
        method: POST
        body_format: json
        body: { email: "{{ admin_email }}", password: "{{ admin_password }}" }
      register: login
      retries: 30
      delay: 2
      until: login.status == 200

    - name: Resolve the root organization
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/account/me"
        headers: { Authorization: "Bearer {{ login.json.token }}" }
      register: me

    - name: Derive a badge for it
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/auth/badge"
        method: POST
        body_format: json
        body: { organization_id: "{{ me.json.organization_id }}" }
        headers: { Authorization: "Bearer {{ login.json.token }}" }
      register: badge

    - name: Remember the badge and organization
      ansible.builtin.set_fact:
        auth: { Authorization: "Bearer {{ badge.json.token }}" }
        org: "{{ me.json.organization_id }}"

    # The catalog fills asynchronously once the daemon resolves its identity
    # (bootstrap-root created it), so the first minute can answer empty.
    - name: Wait for the s3 integration to reach the catalog
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/integrations/catalog"
        headers: "{{ auth }}"
      register: catalog
      retries: 60
      delay: 2
      until: catalog.json['items'] | default([]) | selectattr('name', 'equalto', 's3') | list | length > 0

    - name: Note the catalog's s3 version
      ansible.builtin.set_fact:
        s3_version: "{{ (catalog.json['items'] | selectattr('name', 'equalto', 's3') | first).version }}"

    # The .ptar for this version is already in the pkgs volume (the workflow
    # downloaded it), so this registers it without touching the plugin feed.
    - name: Install the s3 integration
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/integrations/installed"
        method: POST
        body_format: json
        body: { name: s3, version: "{{ s3_version }}" }
        headers: "{{ auth }}"
        status_code: [200, 201]

    - name: Resolve the installed s3 integration id
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/integrations/installed"
        headers: "{{ auth }}"
      register: installed

    - name: Remember it
      ansible.builtin.set_fact:
        s3_integration: "{{ (installed.json['items'] | selectattr('name', 'equalto', 's3') | first).id }}"

    - name: Create the self-managed inventory
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/account/organizations/{{ org }}/inventories/self-managed"
        method: POST
        body_format: json
        body: { name: CI inventory }
        headers: "{{ auth }}"
      register: inventory

    - name: Declare the minio endpoint as a resource
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/inventories/{{ inventory.json.id }}/resources"
        method: POST
        body_format: json
        body:
          urn: urn:res-ci-minio
          name: CI minio
          class: object-storage
          subclass: s3
          service: s3
          endpoints: [{ endpoint: "{{ s3_endpoint }}" }]
        headers: "{{ auth }}"
      register: resource

    - name: Create the source connector
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/account/organizations/{{ org }}/connectors"
        method: POST
        body_format: json
        body:
          name: S3 Source
          type: source
          protocol: s3
          urn_id: "{{ resource.json.urn_id }}"
          integration: { id: "{{ s3_integration }}" }
          data_classes: [database]
          environment: production
          fields: "{{ s3_common_fields | combine({'root': {'value': '/source'}}) }}"
        headers: "{{ auth }}"
      register: source

    - name: Create the store connector
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/account/organizations/{{ org }}/connectors"
        method: POST
        body_format: json
        body:
          name: S3 Store
          type: store
          protocol: s3
          urn_id: "{{ resource.json.urn_id }}"
          integration: { id: "{{ s3_integration }}" }
          temperature: hot
          fields: "{{ s3_common_fields | combine({'root': {'value': '/store'}}) }}"
        headers: "{{ auth }}"
      register: store

    - name: Create the cold store connector
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/account/organizations/{{ org }}/connectors"
        method: POST
        body_format: json
        body:
          name: S3 Store (cold)
          type: store
          protocol: s3
          urn_id: "{{ resource.json.urn_id }}"
          integration: { id: "{{ s3_integration }}" }
          temperature: cold
          fields: "{{ s3_common_fields | combine({'root': {'value': '/store-cold'}}) }}"
        headers: "{{ auth }}"
      register: store_cold

    - name: Create the destination connector
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/account/organizations/{{ org }}/connectors"
        method: POST
        body_format: json
        body:
          name: S3 Destination
          type: destination
          protocol: s3
          urn_id: "{{ resource.json.urn_id }}"
          integration: { id: "{{ s3_integration }}" }
          fields: "{{ s3_common_fields | combine({'root': {'value': '/destination'}}) }}"
        headers: "{{ auth }}"
      register: destination

    # Runs a real job through plaklet with the sideloaded s3 plugin -- also the
    # first proof the stack can execute anything.
    - name: Initialize the kloset stores
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/connectors/{{ item }}/stores/create"
        method: POST
        headers: "{{ auth }}"
      loop:
        - "{{ store.json.id }}"
        - "{{ store_cold.json.id }}"

    - name: Create the service account
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/account/organizations/{{ org }}/invitations"
        method: POST
        body_format: json
        body: { name: ansible-e2e, is_service: true, auto_accept: true }
        headers: "{{ auth }}"
      register: svc

    - name: Grant it the owner role
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/account/organizations/{{ org }}/access"
        method: POST
        body_format: json
        body:
          subject_type: user
          subject_id: "{{ svc.json.accepted.user_id }}"
          role_name: owner
        headers: "{{ auth }}"

    - name: Name it in the connector srwx lists
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/connectors/{{ item }}/roles"
        method: PUT
        body_format: json
        body:
          can_read: ["self:{{ svc.json.accepted.user_id }}"]
          can_execute: ["self:{{ svc.json.accepted.user_id }}"]
          can_write: []
          can_own: []
        headers: "{{ auth }}"
      loop:
        - "{{ source.json.id }}"
        - "{{ store.json.id }}"
        - "{{ store_cold.json.id }}"
        - "{{ destination.json.id }}"

    - name: Mint the API key
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/users/{{ svc.json.accepted.user_id }}/api-keys"
        method: POST
        body_format: json
        body: { description: ansible e2e }
        headers: "{{ auth }}"
      register: apikey

    - name: The key logs in
      ansible.builtin.uri:
        url: "{{ api_url }}/api/v1/auth/login/apikey"
        method: POST
        body_format: json
        body: { api_key: "{{ apikey.json.api_key }}" }

    - name: Write the key for e2e.yml
      ansible.builtin.copy:
        content: "{{ apikey.json.api_key }}"
        dest: "{{ apikey_file }}"
        mode: "0600"

# End-to-end: backup, restore, job_info against a live stack.
#
#   PLAKAR_API_URL=http://localhost:8080 PLAKAR_API_KEY=pcp_ak_... \
#     ansible-playbook tests/integration/e2e.yml
#
# Assumes the connectors setup.yml provisions (S3 Source, S3 Store,
# S3 Destination) and a service account holding the owner role -- the
# hermetic stack under tests/integration/stack/ provides all of it, and the
# plakman dev compose stack's seed data matches too. Override the names with
# -e for another environment.
---
- name: plakarkorp.plakar end-to-end
  hosts: localhost
  gather_facts: false
  vars:
    source_name: S3 Source
    store_name: S3 Store
    destination_name: S3 Destination
    # The resource the declarative modules attach to; the hermetic stack's
    # setup.yml declares it. On the plakman dev stack, override with
    # -e store_resource='Silent Frost' -e source_resource='Novel Core'.
    store_resource: CI minio
    source_resource: CI minio

  tasks:
    - name: Backup in check mode does not run anything
      plakarkorp.plakar.backup:
        source: "{{ source_name }}"
        store: "{{ store_name }}"
      check_mode: true
      register: dry

    - name: Check mode resolved the connectors
      ansible.builtin.assert:
        that:
          - dry.changed
          - dry.source_id is defined
          - dry.at_id is not defined

    - name: Backup
      plakarkorp.plakar.backup:
        source: "{{ source_name }}"
        store: "{{ store_name }}"
        labels: [ansible-e2e]
      register: backup

    - name: Backup succeeded
      ansible.builtin.assert:
        that:
          - backup.changed
          - backup.job.status == 'succeeded'
          - backup.at_id is defined

    - name: Restore the latest snapshot
      plakarkorp.plakar.restore:
        store: "{{ store_name }}"
        destination: "{{ destination_name }}"
      register: restore

    - name: Restore succeeded
      ansible.builtin.assert:
        that:
          - restore.changed
          - restore.job.status == 'succeeded'
          - restore.snapshot_id | length > 0

    - name: Sync the store into the cold store
      plakarkorp.plakar.sync:
        store: "{{ store_name }}"
        to_store: S3 Store (cold)
      register: sync

    - name: Sync succeeded
      ansible.builtin.assert:
        that:
          - sync.changed
          - sync.job.status == 'succeeded'

    - name: Check the store's integrity
      plakarkorp.plakar.check:
        store: "{{ store_name }}"
      register: checked

    - name: Check succeeded
      ansible.builtin.assert:
        that:
          - checked.changed
          - checked.job.status == 'succeeded'

    # A generous rule: proves the wiring both ways without eating the shared
    # dev stack's snapshots.
    - name: Preview a prune, partitioned per source (check mode)
      plakarkorp.plakar.prune:
        store: "{{ store_name }}"
        retention: {year: 100, per_year: 1000}
        group_by: dataset
      check_mode: true
      register: prune_preview

    - name: The rule keeps everything
      ansible.builtin.assert:
        that:
          - not prune_preview.changed
          - prune_preview.deleted | length == 0
          - prune_preview.kept | length > 0

    - name: Prune for real under the same rule is a no-op
      plakarkorp.plakar.prune:
        store: "{{ store_name }}"
        retention: {year: 100, per_year: 1000}
      register: pruned
      failed_when: pruned.changed or (pruned.deleted | length > 0)

    - name: Look the backup job up by id, with its log
      plakarkorp.plakar.job_info:
        job_id: "{{ backup.job.id }}"
        include_log: true
      register: one

    - name: The job is found and carries a log
      ansible.builtin.assert:
        that:
          - one.jobs | length == 1
          - one.jobs[0].status == 'succeeded'
          - one.jobs[0].task_type == 'backup'
          - one.jobs[0].log | length > 0

    - name: List recent succeeded backups
      plakarkorp.plakar.job_info:
        task_type: backup
        status: succeeded
        limit: 10
      register: listing

    - name: The listing contains our job
      ansible.builtin.assert:
        that:
          - listing.total >= 1
          - backup.job.id in (listing.jobs | map(attribute='id') | list)

    - name: Unknown connector name fails with the visible names
      plakarkorp.plakar.backup:
        source: does-not-exist
        store: "{{ store_name }}"
      register: missing
      failed_when: missing is not failed

    - name: Fire and forget, then poll
      plakarkorp.plakar.restore:
        store: "{{ store_name }}"
        destination: "{{ destination_name }}"
        wait: false
      register: bg

    - name: Poll until the background restore stops
      plakarkorp.plakar.job_info:
        at_id: "{{ bg.at_id }}"
      register: bg_info
      until: >-
        bg_info.jobs | length > 0
        and bg_info.jobs[0].stopped_at is not none
      retries: 60
      delay: 2

    - name: The background restore succeeded
      ansible.builtin.assert:
        that:
          - bg_info.jobs[0].status == 'succeeded'
          - bg_info.jobs[0].task_type == 'restore'

    # --- prune: real deletion and filters, on a lab store ------------------
    - name: Clean slate
      plakarkorp.plakar.store:
        name: Prune lab
        state: absent

    - name: A store of our own
      plakarkorp.plakar.store:
        name: Prune lab
        integration: s3
        resource: Silent Frost
        environment: production
        fields:
          passphrase: correcthorsebatterystaple
          access_key: minioadmin
          secret_access_key: minioadmin
          port: 9000
          root: /prune-lab
          storage_class: STANDARD
          use_tls: false
          tls_insecure_no_verify: false
          virtual_host: false

    - name: Two nightly backups and a keeper
      plakarkorp.plakar.backup:
        source: S3 Source
        store: Prune lab
        labels: "{{ item }}"
      loop:
        - [nightly]
        - [nightly]
        - [keepme]

    # Store now holds: nightly, nightly, keepme — all today.

    - name: Preview — only nightly considered, keep one per day
      plakarkorp.plakar.prune:
        store: Prune lab
        retention: {day: 1, per_day: 1}
        tags: [nightly]
      check_mode: true
      register: preview

    - name: The preview would delete exactly one nightly
      ansible.builtin.assert:
        that:
          - preview.changed
          - preview.deleted | length == 1
          - preview.kept | length >= 1

    - name: Prune for real
      plakarkorp.plakar.prune:
        store: Prune lab
        retention: {day: 1, per_day: 1}
        tags: [nightly]
      register: pruned

    - name: One nightly gone, deletion job ran to completion
      ansible.builtin.assert:
        that:
          - pruned.changed
          - pruned.deleted | length == 1
          - pruned.job.status == 'succeeded'

    - name: Pruning again under the same rule is a no-op
      plakarkorp.plakar.prune:
        store: Prune lab
        retention: {day: 1, per_day: 1}
        tags: [nightly]
      register: again
      failed_when: again.changed

    # Store now holds: nightly, keepme. The same day-1/per-day-1 rule over
    # both would delete one — unless ignore_tags takes the keeper out of
    # consideration, leaving a single snapshot that the rule keeps.
    - name: Without ignore_tags the rule would delete one (control)
      plakarkorp.plakar.prune:
        store: Prune lab
        retention: {day: 1, per_day: 1}
      check_mode: true
      register: control
      failed_when: control.deleted | length != 1

    - name: With ignore_tags the keeper is out of reach
      plakarkorp.plakar.prune:
        store: Prune lab
        retention: {day: 1, per_day: 1}
        filters:
          ignore_tags: [keepme]
      check_mode: true
      register: spare
      failed_when: spare.deleted | length != 0

    - name: Tear the lab down
      plakarkorp.plakar.store:
        name: Prune lab
        state: absent

    # --- declarative resources (step 3) -----------------------------------
    # Clean slate first, so a re-run over a previously aborted play still
    # asserts real creations below.
    - name: Clean up any leftovers
      block:
        - plakarkorp.plakar.connector:
            name: Ansible source
            type: source
            state: absent
        - plakarkorp.plakar.store:
            name: Ansible repo
            state: absent

    # No protocol: it defaults to the integration name.
    - name: Create a managed store
      plakarkorp.plakar.store:
        name: Ansible repo
        integration: s3
        resource: "{{ store_resource }}"
        environment: production
        compression: LZ4
        fields:
          passphrase: correcthorsebatterystaple
          access_key: minioadmin
          secret_access_key: minioadmin
          port: 9000
          root: /ansible-repo
          storage_class: STANDARD
          use_tls: false
          tls_insecure_no_verify: false
          virtual_host: false
      register: repo

    - name: The store was created and initialized
      ansible.builtin.assert:
        that:
          - repo.changed
          - repo.connector.initialized

    - name: The same store again is a no-op
      plakarkorp.plakar.store:
        name: Ansible repo
        protocol: s3
        integration: s3
        resource: "{{ store_resource }}"
        environment: production
        fields:
          root: /ansible-repo
      register: repo_again
      failed_when: repo_again.changed

    - name: Changing a field is an update
      plakarkorp.plakar.store:
        name: Ansible repo
        fields:
          storage_class: STANDARD_IA
      register: repo_update

    - name: The update reports what differed
      ansible.builtin.assert:
        that:
          - repo_update.changed
          - repo_update.diff_keys == ['fields']

    - name: Create a managed source connector
      plakarkorp.plakar.connector:
        name: Ansible source
        type: source
        protocol: s3
        integration: s3
        resource: "{{ source_resource }}"
        environment: production
        data_classes: [database]
        fields:
          passphrase: correcthorsebatterystaple
          access_key: minioadmin
          secret_access_key: minioadmin
          port: 9000
          root: /source
      register: src_created

    # --- teardown, itself an idempotency check ----------------------------
    - name: Drop the source
      plakarkorp.plakar.connector:
        name: Ansible source
        type: source
        state: absent

    - name: Drop the store
      plakarkorp.plakar.store:
        name: Ansible repo
        state: absent
      register: repo_gone

    - name: Dropping it again is a no-op
      plakarkorp.plakar.store:
        name: Ansible repo
        state: absent
      register: repo_gone_again
      failed_when: repo_gone_again.changed or not repo_gone.changed

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "backup {{ backup.job.id }}: {{ backup.job.status }}"
          - "restore {{ restore.job.id }}: {{ restore.job.status }} (snapshot {{ restore.snapshot_id }})"
          - "declarative round-trip: store and connector all green"

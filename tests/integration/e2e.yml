# End-to-end: backup, restore, job_info against a live stack.
#
#   PLAKAR_API_URL=http://localhost:8080 PLAKAR_API_KEY=pcp_ak_... \
#     ansible-playbook tests/integration/e2e.yml
#
# Assumes the connectors setup.yml provisions (S3 Source, S3 Store,
# S3 Destination) and a service account holding the owner role -- the
# hermetic stack under tests/integration/stack/ provides all of it, and the
# plakman dev compose stack's seed data matches too. Override the names with
# -e for another environment.
---
- name: plakarkorp.plakar end-to-end
  hosts: localhost
  gather_facts: false
  vars:
    source_name: S3 Source
    store_name: S3 Store
    destination_name: S3 Destination
    # The resource the declarative modules attach to; the hermetic stack's
    # setup.yml declares it. On the plakman dev stack, override with
    # -e store_resource='Silent Frost' -e source_resource='Novel Core'.
    store_resource: CI minio
    source_resource: CI minio

  tasks:
    - name: Backup in check mode does not run anything
      plakarkorp.plakar.backup:
        source: "{{ source_name }}"
        store: "{{ store_name }}"
      check_mode: true
      register: dry

    - name: Check mode resolved the connectors
      ansible.builtin.assert:
        that:
          - dry.changed
          - dry.source_id is defined
          - dry.at_id is not defined

    - name: Backup
      plakarkorp.plakar.backup:
        source: "{{ source_name }}"
        store: "{{ store_name }}"
        labels: [ansible-e2e]
      register: backup

    - name: Backup succeeded
      ansible.builtin.assert:
        that:
          - backup.changed
          - backup.job.status == 'succeeded'
          - backup.at_id is defined

    - name: Restore the latest snapshot
      plakarkorp.plakar.restore:
        store: "{{ store_name }}"
        destination: "{{ destination_name }}"
      register: restore

    - name: Restore succeeded
      ansible.builtin.assert:
        that:
          - restore.changed
          - restore.job.status == 'succeeded'
          - restore.snapshot_id | length > 0

    - name: Sync the store into the cold store
      plakarkorp.plakar.sync:
        store: "{{ store_name }}"
        to_store: S3 Store (cold)
      register: sync

    - name: Sync succeeded
      ansible.builtin.assert:
        that:
          - sync.changed
          - sync.job.status == 'succeeded'

    - name: Check the store's integrity
      plakarkorp.plakar.check:
        store: "{{ store_name }}"
      register: checked

    - name: Check succeeded
      ansible.builtin.assert:
        that:
          - checked.changed
          - checked.job.status == 'succeeded'

    # A generous rule: proves the wiring both ways without eating the shared
    # dev stack's snapshots.
    - name: Preview a prune, partitioned per source (check mode)
      plakarkorp.plakar.prune:
        store: "{{ store_name }}"
        retention: {year: 100, per_year: 1000}
        group_by: dataset
      check_mode: true
      register: prune_preview

    - name: The rule keeps everything
      ansible.builtin.assert:
        that:
          - not prune_preview.changed
          - prune_preview.deleted | length == 0
          - prune_preview.kept | length > 0

    - name: Prune for real under the same rule is a no-op
      plakarkorp.plakar.prune:
        store: "{{ store_name }}"
        retention: {year: 100, per_year: 1000}
      register: pruned
      failed_when: pruned.changed or (pruned.deleted | length > 0)

    - name: Look the backup job up by id, with its log
      plakarkorp.plakar.job_info:
        job_id: "{{ backup.job.id }}"
        include_log: true
      register: one

    - name: The job is found and carries a log
      ansible.builtin.assert:
        that:
          - one.jobs | length == 1
          - one.jobs[0].status == 'succeeded'
          - one.jobs[0].task_type == 'backup'
          - one.jobs[0].log | length > 0

    - name: List recent succeeded backups
      plakarkorp.plakar.job_info:
        task_type: backup
        status: succeeded
        limit: 10
      register: listing

    - name: The listing contains our job
      ansible.builtin.assert:
        that:
          - listing.total >= 1
          - backup.job.id in (listing.jobs | map(attribute='id') | list)

    - name: Unknown connector name fails with the visible names
      plakarkorp.plakar.backup:
        source: does-not-exist
        store: "{{ store_name }}"
      register: missing
      failed_when: missing is not failed

    - name: Fire and forget, then poll
      plakarkorp.plakar.restore:
        store: "{{ store_name }}"
        destination: "{{ destination_name }}"
        wait: false
      register: bg

    - name: Poll until the background restore stops
      plakarkorp.plakar.job_info:
        at_id: "{{ bg.at_id }}"
      register: bg_info
      until: >-
        bg_info.jobs | length > 0
        and bg_info.jobs[0].stopped_at is not none
      retries: 60
      delay: 2

    - name: The background restore succeeded
      ansible.builtin.assert:
        that:
          - bg_info.jobs[0].status == 'succeeded'
          - bg_info.jobs[0].task_type == 'restore'

    # --- prune: real deletion and filters, on a lab store ------------------
    - name: Clean slate
      plakarkorp.plakar.store:
        name: Prune lab
        state: absent

    - name: A store of our own
      plakarkorp.plakar.store:
        name: Prune lab
        integration: s3
        resource: "{{ store_resource }}"
        environment: production
        fields:
          passphrase: correcthorsebatterystaple
          access_key: minioadmin
          secret_access_key: minioadmin
          port: 9000
          root: /prune-lab
          storage_class: STANDARD
          use_tls: false
          tls_insecure_no_verify: false
          virtual_host: false

    - name: Two nightly backups and a keeper
      plakarkorp.plakar.backup:
        source: S3 Source
        store: Prune lab
        labels: "{{ item }}"
      loop:
        - [nightly]
        - [nightly]
        - [keepme]

    # Store now holds: nightly, nightly, keepme — all today.

    - name: Preview — only nightly considered, keep one per day
      plakarkorp.plakar.prune:
        store: Prune lab
        retention: {day: 1, per_day: 1}
        tags: [nightly]
      check_mode: true
      register: preview

    - name: The preview would delete exactly one nightly
      ansible.builtin.assert:
        that:
          - preview.changed
          - preview.deleted | length == 1
          - preview.kept | length >= 1

    - name: Prune for real
      plakarkorp.plakar.prune:
        store: Prune lab
        retention: {day: 1, per_day: 1}
        tags: [nightly]
      register: pruned

    - name: One nightly gone, deletion job ran to completion
      ansible.builtin.assert:
        that:
          - pruned.changed
          - pruned.deleted | length == 1
          - pruned.jobs | map(attribute='status') | unique | list == ['succeeded']

    - name: Pruning again under the same rule is a no-op
      plakarkorp.plakar.prune:
        store: Prune lab
        retention: {day: 1, per_day: 1}
        tags: [nightly]
      register: again
      failed_when: again.changed

    # Store now holds: nightly, keepme. The same day-1/per-day-1 rule over
    # both would delete one — unless ignore_tags takes the keeper out of
    # consideration, leaving a single snapshot that the rule keeps.
    - name: Without ignore_tags the rule would delete one (control)
      plakarkorp.plakar.prune:
        store: Prune lab
        retention: {day: 1, per_day: 1}
      check_mode: true
      register: control
      failed_when: control.deleted | length != 1

    - name: With ignore_tags the keeper is out of reach
      plakarkorp.plakar.prune:
        store: Prune lab
        retention: {day: 1, per_day: 1}
        filters:
          ignore_tags: [keepme]
      check_mode: true
      register: spare
      failed_when: spare.deleted | length != 0

    - name: Tear the lab down
      plakarkorp.plakar.store:
        name: Prune lab
        state: absent

    # --- declarative resources (step 3) -----------------------------------
    # Clean slate first, so a re-run over a previously aborted play still
    # asserts real creations below.
    - name: Clean up any leftovers
      block:
        - plakarkorp.plakar.connector:
            name: Ansible source
            type: source
            state: absent
        - plakarkorp.plakar.store:
            name: Ansible repo
            state: absent

    # A store is encrypted at rest, so creating one without a passphrase
    # would leave a store the API accepts and nobody can trust. Check mode
    # has to refuse it too, or a dry run would report success for a play
    # that cannot work.
    - name: A store with no passphrase is refused
      plakarkorp.plakar.store:
        name: Passphraseless
        integration: s3
        resource: "{{ store_resource }}"
        fields:
          access_key: minioadmin
          root: /nope
      register: no_pass
      failed_when: no_pass is not failed

    - name: An empty passphrase is refused as well
      plakarkorp.plakar.store:
        name: Passphraseless
        integration: s3
        resource: "{{ store_resource }}"
        fields:
          passphrase: "   "
          root: /nope
      register: blank_pass
      failed_when: blank_pass is not failed

    - name: Check mode refuses it too, rather than reporting a clean run
      plakarkorp.plakar.store:
        name: Passphraseless
        integration: s3
        resource: "{{ store_resource }}"
        fields:
          root: /nope
      check_mode: true
      register: check_pass
      failed_when: check_pass is not failed

    # initialize: false means the storage was set up elsewhere, passphrase
    # and all, so the requirement does not apply.
    - name: Without initialization the passphrase is not required
      plakarkorp.plakar.store:
        name: Adopted store
        integration: s3
        resource: "{{ store_resource }}"
        initialize: false
        fields:
          access_key: minioadmin
          root: /adopted
      register: adopted

    - name: The adopted store was created, uninitialized
      assert:
        that:
          - adopted.changed
          - not adopted.connector.initialized

    - name: Drop the adopted store
      plakarkorp.plakar.store:
        name: Adopted store
        state: absent

    # The API answers 200 to an initialization that failed. The task has to
    # fail, and to leave no store behind: found by a later run, it would be
    # reported present and never initialized.
    - name: A store whose storage refuses the keys fails
      plakarkorp.plakar.store:
        name: Unreachable store
        integration: s3
        resource: "{{ store_resource }}"
        fields:
          passphrase: correcthorsebatterystaple
          access_key: not-a-key
          secret_access_key: not-a-secret
          port: 9000
          root: /unreachable
          use_tls: false
      register: unreachable
      failed_when: >-
        unreachable is not failed
        or 'failed to initialize' not in unreachable.msg

    - name: It left no store behind
      plakarkorp.plakar.store:
        name: Unreachable store
        state: absent
      register: unreachable_gone
      failed_when: unreachable_gone is failed or unreachable_gone.changed

    # No protocol: it defaults to the integration name.
    - name: Create a managed store
      plakarkorp.plakar.store:
        name: Ansible repo
        integration: s3
        resource: "{{ store_resource }}"
        environment: production
        compression: LZ4
        fields:
          passphrase: correcthorsebatterystaple
          access_key: minioadmin
          secret_access_key: minioadmin
          port: 9000
          root: /ansible-repo
          storage_class: STANDARD
          use_tls: false
          tls_insecure_no_verify: false
          virtual_host: false
      register: repo

    - name: The store was created and initialized
      ansible.builtin.assert:
        that:
          - repo.changed
          - repo.connector.initialized

    - name: The same store again is a no-op
      plakarkorp.plakar.store:
        name: Ansible repo
        protocol: s3
        integration: s3
        resource: "{{ store_resource }}"
        environment: production
        fields:
          root: /ansible-repo
      register: repo_again
      failed_when: repo_again.changed

    # A Control Plane from v0.19 on does not show the secrets it holds; the
    # task that created the store, secrets included, must still be a no-op.
    - name: The same store again, secrets included, is a no-op
      plakarkorp.plakar.store:
        name: Ansible repo
        integration: s3
        resource: "{{ store_resource }}"
        fields:
          passphrase: correcthorsebatterystaple
          access_key: minioadmin
          secret_access_key: minioadmin
          root: /ansible-repo
      register: repo_secrets_again
      failed_when: repo_secrets_again.changed

    - name: Changing a field is an update
      plakarkorp.plakar.store:
        name: Ansible repo
        fields:
          storage_class: STANDARD_IA
      register: repo_update

    - name: The update reports what differed
      ansible.builtin.assert:
        that:
          - repo_update.changed
          - repo_update.diff_keys == ['fields']

    - name: Create a managed source connector
      plakarkorp.plakar.connector:
        name: Ansible source
        type: source
        protocol: s3
        integration: s3
        resource: "{{ source_resource }}"
        environment: production
        data_classes: [database]
        fields:
          passphrase: correcthorsebatterystaple
          access_key: minioadmin
          secret_access_key: minioadmin
          port: 9000
          root: /source
      register: src_created

    # --- teardown, itself an idempotency check ----------------------------
    - name: Drop the source
      plakarkorp.plakar.connector:
        name: Ansible source
        type: source
        state: absent

    - name: Drop the store
      plakarkorp.plakar.store:
        name: Ansible repo
        state: absent
      register: repo_gone

    - name: Dropping it again is a no-op
      plakarkorp.plakar.store:
        name: Ansible repo
        state: absent
      register: repo_gone_again
      failed_when: repo_gone_again.changed or not repo_gone.changed

    # --- integrations --------------------------------------------------------
    # setup.yml registered the sideloaded vault package; this makes that
    # version the current one. Nothing is uninstalled for real: an uninstall
    # deletes the package, and installing it again would need the
    # license-authenticated feed this stack does not have.
    - name: Install vault
      plakarkorp.plakar.integration:
        name: vault
      register: vault_integration

    - name: Installed again is a no-op
      plakarkorp.plakar.integration:
        name: vault
      register: vault_again
      failed_when: vault_again is failed or vault_again.changed

    - name: Pinned to the version it is on is a no-op too
      plakarkorp.plakar.integration:
        name: vault
        version: "{{ vault_again.integration.version }}"
      register: vault_pinned
      failed_when: >-
        vault_pinned is failed or vault_pinned.changed
        or vault_pinned.integration.id != vault_again.integration.id

    # The install route answers an unknown version or name with a bare 500.
    - name: A version the catalog does not offer is refused, with those it does
      plakarkorp.plakar.integration:
        name: vault
        version: v0.0.1
      register: vault_no_version
      failed_when: >-
        vault_no_version is not failed
        or vault_again.integration.version not in vault_no_version.msg

    - name: An integration the catalog does not have is refused
      plakarkorp.plakar.integration:
        name: no-such-integration
      register: no_integration
      failed_when: no_integration is not failed or 'catalog' not in no_integration.msg

    - name: Uninstalling in check mode reports the versions and removes nothing
      plakarkorp.plakar.integration:
        name: vault
        state: absent
      check_mode: true
      register: vault_dry_gone
      failed_when: >-
        vault_dry_gone is failed or not vault_dry_gone.changed
        or vault_dry_gone.integration.versions != [vault_again.integration.version]

    - name: It is still installed
      plakarkorp.plakar.integration:
        name: vault
      register: vault_still
      failed_when: vault_still is failed or vault_still.changed

    # --- secret providers ----------------------------------------------------
    # Declaring a provider only records how to reach a secret manager, so
    # none has to answer here; the URL and the token are made up.
    - name: Clean up what references a secret provider leftover
      block:
        - plakarkorp.plakar.connector:
            name: Ansible vaulted source
            type: source
            state: absent
        - plakarkorp.plakar.inventory:
            name: Ansible vaulted scaleway
            state: absent

    - name: Clean up a secret provider leftover
      plakarkorp.plakar.secret_provider:
        name: Ansible vault
        state: absent

    - name: A secret provider without the field its protocol requires is refused
      plakarkorp.plakar.secret_provider:
        name: Ansible vault
        integration: vault
        fields:
          token: made-up-token
      register: sp_no_url
      failed_when: sp_no_url is not failed or 'url' not in sp_no_url.msg

    # vault speaks vault-sm: the protocol is not the integration's name, and
    # the API answers an unknown one with a 500.
    - name: A protocol the integration does not declare is refused
      plakarkorp.plakar.secret_provider:
        name: Ansible vault
        integration: vault
        protocol: vault
        fields:
          url: http://vault.internal:8200
      register: sp_bad_protocol
      failed_when: sp_bad_protocol is not failed or 'vault-sm' not in sp_bad_protocol.msg

    - name: Declare a Vault
      plakarkorp.plakar.secret_provider:
        name: Ansible vault
        integration: vault
        fields:
          url: http://vault.internal:8200
          token: made-up-token
      register: sp_created

    - name: It was created, on the protocol the integration declares
      ansible.builtin.assert:
        that:
          - sp_created.changed
          - sp_created.secret_provider.protocol == 'vault-sm'

    - name: The same provider again, token included, is a no-op
      plakarkorp.plakar.secret_provider:
        name: Ansible vault
        integration: vault
        fields:
          url: http://vault.internal:8200
          token: made-up-token
      register: sp_again
      failed_when: sp_again is failed or sp_again.changed

    - name: Moving its URL names no token
      plakarkorp.plakar.secret_provider:
        name: Ansible vault
        fields:
          url: http://vault2.internal:8200
      register: sp_moved
      failed_when: sp_moved is failed or sp_moved.diff_keys | default([]) != ['fields']

    # The update replaces the whole field map: had it dropped the token, the
    # playbook's would differ from nothing and this task would send it again.
    - name: The token survived the update
      plakarkorp.plakar.secret_provider:
        name: Ansible vault
        fields:
          url: http://vault2.internal:8200
          token: made-up-token
      register: sp_kept
      failed_when: sp_kept is failed or sp_kept.changed

    # A reference is recorded when the object is declared and resolved when
    # Plakar needs the value, so no secret manager has to answer here either.
    - name: A source whose secret key lives in the provider, by name
      plakarkorp.plakar.connector:
        name: Ansible vaulted source
        type: source
        integration: s3
        resource: "{{ source_resource }}"
        fields:
          access_key: minioadmin
          root: /source
          secret_access_key:
            value: secret/ci/s3#secret_key
            provider: Ansible vault
      register: vaulted
      failed_when: vaulted is failed or not vaulted.changed

    - name: The same source with the provider by id is a no-op
      plakarkorp.plakar.connector:
        name: Ansible vaulted source
        type: source
        fields:
          secret_access_key:
            value: secret/ci/s3#secret_key
            provider_id: "{{ sp_created.secret_provider.id }}"
      register: vaulted_by_id
      failed_when: vaulted_by_id is failed or vaulted_by_id.changed

    # The message names the field: Ansible masks the values of fields, the
    # provider's name with them.
    - name: A provider nobody declared is refused
      plakarkorp.plakar.connector:
        name: Ansible vaulted source
        type: source
        fields:
          secret_access_key:
            value: secret/ci/s3#secret_key
            provider: No such vault
      register: no_vault
      failed_when: no_vault is not failed or 'fields.secret_access_key' not in no_vault.msg

    - name: An inventory whose secret key lives in the provider, by name
      plakarkorp.plakar.inventory:
        name: Ansible vaulted scaleway
        type: scaleway
        configuration:
          scw_project_id: 11111111-2222-3333-4444-555555555555
          scw_access_key: SCWAAAAAAAAAAAAAAAAA
          scw_secret_key:
            value: 66666666-7777-8888-9999-000000000000#secret_key
            provider: Ansible vault
      register: vaulted_inv
      failed_when: vaulted_inv is failed or not vaulted_inv.changed

    - name: The same inventory again is a no-op
      plakarkorp.plakar.inventory:
        name: Ansible vaulted scaleway
        configuration:
          scw_secret_key:
            value: 66666666-7777-8888-9999-000000000000#secret_key
            provider: Ansible vault
      register: vaulted_inv_again
      failed_when: vaulted_inv_again is failed or vaulted_inv_again.changed

    - name: Drop the source and the inventory that reference it
      block:
        - plakarkorp.plakar.connector:
            name: Ansible vaulted source
            type: source
            state: absent
        - plakarkorp.plakar.inventory:
            name: Ansible vaulted scaleway
            state: absent

    - name: Drop the secret provider
      plakarkorp.plakar.secret_provider:
        name: Ansible vault
        state: absent
      register: sp_gone

    - name: Dropping it again is a no-op
      plakarkorp.plakar.secret_provider:
        name: Ansible vault
        state: absent
      register: sp_gone_again
      failed_when: sp_gone_again.changed or not sp_gone.changed

    # --- inventories (round two) -------------------------------------------
    # Clean slate first, so a re-run over a previously aborted play still
    # asserts real creations below.
    - name: Clean up an inventory leftover
      plakarkorp.plakar.inventory:
        name: Ansible inventory
        state: absent

    - name: Create a self-managed inventory
      plakarkorp.plakar.inventory:
        name: Ansible inventory
        type: self-managed
      register: inv_created

    - name: The same inventory again is a no-op
      plakarkorp.plakar.inventory:
        name: Ansible inventory
        type: self-managed
      register: inv_again
      failed_when: inv_again.changed or not inv_created.changed

    - name: Declare a resource in it
      plakarkorp.plakar.inventory_resource:
        inventory: Ansible inventory
        urn: urn:res-ansible-e2e
        name: E2E box
        class: object-storage
        subclass: s3
        service: s3
        endpoints: [e2e-box.internal]
        tags: [e2e]
      register: res_created

    - name: The same resource again is a no-op
      plakarkorp.plakar.inventory_resource:
        inventory: Ansible inventory
        urn: urn:res-ansible-e2e
        name: E2E box
        class: object-storage
        endpoints: [e2e-box.internal]
        tags: [e2e]
      register: res_again
      failed_when: res_again.changed or not res_created.changed

    - name: Retagging it is an update
      plakarkorp.plakar.inventory_resource:
        inventory: Ansible inventory
        urn: urn:res-ansible-e2e
        tags: [e2e, retagged]
      register: res_update

    - name: The update reports what differed
      ansible.builtin.assert:
        that:
          - res_update.changed
          - res_update.diff_keys == ['tags']

    - name: Read the inventory back, resources included
      plakarkorp.plakar.inventory_info:
        name: Ansible inventory
        include_resources: true
      register: inv_info

    - name: Info carries the resource
      ansible.builtin.assert:
        that:
          - inv_info.inventory.type == 'self-managed'
          - inv_info.resources | selectattr('urn', 'equalto', 'urn:res-ansible-e2e') | list | length == 1

    - name: The listing sees it too
      plakarkorp.plakar.inventory_info:
      register: inv_listing
      failed_when: >-
        'Ansible inventory' not in (inv_listing.inventories | map(attribute='name') | list)

    # On a self-managed inventory the sync is a server-side no-op, but it
    # exercises the whole path: name resolution, the mutating GET, the ok box.
    - name: Sync the inventory
      plakarkorp.plakar.inventory_sync:
        name: Ansible inventory
      register: inv_synced
      failed_when: not inv_synced.changed

    - name: Syncing an unknown inventory fails with the visible names
      plakarkorp.plakar.inventory_sync:
        name: does-not-exist
      register: sync_missing
      failed_when: sync_missing is not failed

    - name: Drop the resource
      plakarkorp.plakar.inventory_resource:
        inventory: Ansible inventory
        urn: urn:res-ansible-e2e
        state: absent
      register: res_gone

    - name: Drop the inventory
      plakarkorp.plakar.inventory:
        name: Ansible inventory
        state: absent
      register: inv_gone

    - name: Dropping it again is a no-op
      plakarkorp.plakar.inventory:
        name: Ansible inventory
        state: absent
      register: inv_gone_again
      failed_when: inv_gone_again.changed or not inv_gone.changed or not res_gone.changed

    # --- inventory secrets ---------------------------------------------------
    # The keys are made up: nothing here synchronizes the inventory.
    - name: Clean up a Scaleway leftover
      plakarkorp.plakar.inventory:
        name: Ansible scaleway
        state: absent

    - name: A Scaleway inventory
      plakarkorp.plakar.inventory:
        name: Ansible scaleway
        type: scaleway
        configuration:
          scw_project_id: 11111111-2222-3333-4444-555555555555
          scw_access_key: SCWAAAAAAAAAAAAAAAAA
          scw_secret_key: made-up-secret
      register: scw_created
      failed_when: scw_created is failed or not scw_created.changed

    - name: The same inventory again, keys included, is a no-op
      plakarkorp.plakar.inventory:
        name: Ansible scaleway
        type: scaleway
        configuration:
          scw_project_id: 11111111-2222-3333-4444-555555555555
          scw_access_key: SCWAAAAAAAAAAAAAAAAA
          scw_secret_key: made-up-secret
      register: scw_again
      failed_when: scw_again is failed or scw_again.changed

    - name: Moving it to another project names no key
      plakarkorp.plakar.inventory:
        name: Ansible scaleway
        configuration:
          scw_project_id: 99999999-2222-3333-4444-555555555555
      register: scw_moved
      failed_when: scw_moved is failed or scw_moved.diff_keys | default([]) != ['scw_project_id']

    # An update that emptied the keys would leave them differing from the
    # playbook's, and this task would send them again.
    - name: The keys survived the update
      plakarkorp.plakar.inventory:
        name: Ansible scaleway
        configuration:
          scw_project_id: 99999999-2222-3333-4444-555555555555
          scw_access_key: SCWAAAAAAAAAAAAAAAAA
          scw_secret_key: made-up-secret
      register: scw_kept
      failed_when: scw_kept is failed or scw_kept.changed

    - name: Drop the Scaleway inventory
      plakarkorp.plakar.inventory:
        name: Ansible scaleway
        state: absent

    # --- organizations, members, grants (round three) ----------------------
    - name: Clean up a tenant leftover
      plakarkorp.plakar.organization:
        name: E2E tenant
        state: absent

    - name: A tenant of our own
      plakarkorp.plakar.organization:
        name: E2E tenant
      register: tenant

    - name: The same tenant again is a no-op
      plakarkorp.plakar.organization:
        name: E2E tenant
      register: tenant_again
      failed_when: tenant_again.changed or not tenant.changed

    - name: Alice joins it
      plakarkorp.plakar.member:
        organization: E2E tenant
        email: alice@example.com
        name: Alice
      register: alice

    # On a pristine stack the address is brand new and a one-time password
    # comes back; on a re-run the account survives the tenant teardown (a
    # membership removal never deletes the person) and no password is minted.
    - name: The membership was created, with a password iff the account is new
      ansible.builtin.assert:
        that:
          - alice.changed
          - "'alice@example.com' in alice.member.account"
          - not alice.account_created or alice.generated_password is not none

    - name: Alice again is a no-op
      plakarkorp.plakar.member:
        organization: E2E tenant
        email: alice@example.com
      register: alice_again
      failed_when: alice_again.changed

    - name: A service account for the tenant's automation
      plakarkorp.plakar.member:
        organization: E2E tenant
        name: e2e-robot
        service: true
      register: robot
      failed_when: not robot.changed or 'service.internal' not in robot.member.account

    - name: The robot again is a no-op
      plakarkorp.plakar.member:
        organization: E2E tenant
        name: e2e-robot
        service: true
      register: robot_again
      failed_when: robot_again.changed

    - name: An unknown role fails with the catalogue
      plakarkorp.plakar.grant:
        organization: E2E tenant
        subject: alice@example.com
        role: emperor
      register: bad_role
      failed_when: bad_role is not failed or 'owner' not in (bad_role.msg | default(''))

    - name: Alice audits, the robot operates
      plakarkorp.plakar.grant:
        organization: E2E tenant
        subject: "{{ item.subject }}"
        role: "{{ item.role }}"
      loop:
        - {subject: alice@example.com, role: auditor}
        - {subject: e2e-robot, role: operator}

    - name: The same grants again are no-ops
      plakarkorp.plakar.grant:
        organization: E2E tenant
        subject: "{{ item.subject }}"
        role: "{{ item.role }}"
      loop:
        - {subject: alice@example.com, role: auditor}
        - {subject: e2e-robot, role: operator}
      register: grants_again
      failed_when: grants_again.changed

    - name: Read the tenant back
      plakarkorp.plakar.organization_info:
        name: E2E tenant
        include_members: true
        include_grants: true
      register: tenant_info

    - name: Members and grants are what we declared
      ansible.builtin.assert:
        that:
          - tenant_info.members | length == 2
          - tenant_info.grants | length == 2
          - (tenant_info.grants | selectattr('role', 'equalto', 'operator') | first).subject.name == 'e2e-robot'

    - name: Revoke the audit
      plakarkorp.plakar.grant:
        organization: E2E tenant
        subject: alice@example.com
        role: auditor
        state: absent
      register: revoked
      failed_when: not revoked.changed

    - name: Alice leaves
      plakarkorp.plakar.member:
        organization: E2E tenant
        email: alice@example.com
        state: absent

    - name: The robot leaves too
      plakarkorp.plakar.member:
        organization: E2E tenant
        name: e2e-robot
        service: true
        state: absent

    # The organization is deletable only once no members remain besides the
    # caller — the API answers 409 otherwise.
    - name: Tear the tenant down
      plakarkorp.plakar.organization:
        name: E2E tenant
        state: absent
      register: tenant_gone

    - name: Gone is gone
      plakarkorp.plakar.organization:
        name: E2E tenant
        state: absent
      register: tenant_gone_again
      failed_when: tenant_gone_again.changed or not tenant_gone.changed

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "backup {{ backup.job.id }}: {{ backup.job.status }}"
          - "restore {{ restore.job.id }}: {{ restore.job.status }} (snapshot {{ restore.snapshot_id }})"
          - "declarative round-trip: store, connector and inventory all green"

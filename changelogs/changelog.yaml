ancestor: null
releases:
  0.1.0:
    changes:
      release_summary: 'First release of the collection: trigger backups, restores,
        store syncs,

        integrity checks and retention prunes, query job state, and declare stores,

        connectors, inventories, organizations, members and grants against the

        Plakar management API.

        '
    fragments:
    - 0.1.0-initial.yml
    modules:
    - description: Trigger a Plakar backup.
      name: backup
      namespace: ''
    - description: Verify the integrity of Plakar snapshots.
      name: check
      namespace: ''
    - description: Manage Plakar source and destination connectors.
      name: connector
      namespace: ''
    - description: Manage role grants in a Plakar organization.
      name: grant
      namespace: ''
    - description: Manage Plakar inventories.
      name: inventory
      namespace: ''
    - description: Read Plakar inventories and their resources.
      name: inventory_info
      namespace: ''
    - description: Manage resources in a self-managed Plakar inventory.
      name: inventory_resource
      namespace: ''
    - description: Synchronize a Plakar inventory against its provider.
      name: inventory_sync
      namespace: ''
    - description: Query Plakar job state.
      name: job_info
      namespace: ''
    - description: Manage the members of a Plakar organization.
      name: member
      namespace: ''
    - description: Manage Plakar organizations.
      name: organization
      namespace: ''
    - description: Read a Plakar organization, its members and its grants.
      name: organization_info
      namespace: ''
    - description: Prune snapshots from a Plakar store by retention rule.
      name: prune
      namespace: ''
    - description: Trigger a Plakar restore.
      name: restore
      namespace: ''
    - description: Manage Plakar stores.
      name: store
      namespace: ''
    - description: Sync snapshots between Plakar stores.
      name: sync
      namespace: ''
    release_date: '2026-09-02'
